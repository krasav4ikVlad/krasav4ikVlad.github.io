[project]
name = "rsvpn-bot"
version = "1.0.0"
requires-python = ">=3.11"
dependencies = [
    "aiogram>=3.13",
    "motor>=3.5",
    "httpx>=0.27",
    "apscheduler>=3.10",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.6", "mypy>=1.11"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "ASYNC"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
