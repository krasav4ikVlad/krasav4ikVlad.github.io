services:
  nginx:
    image: nginx:1.27-alpine
    ports:
      # docker publishes ports past ufw, so bind to localhost by default —
      # Caddy (или другой https-прокси) слушает наружу. Для доступа прямо
      # по IP:8080 поставьте DASHBOARD_BIND=0.0.0.0 в .env.
      - "${DASHBOARD_BIND:-127.0.0.1}:${DASHBOARD_PORT:-8080}:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend
    restart: unless-stopped

  frontend:
    build: ./frontend
    restart: unless-stopped

  backend:
    build: ./backend
    env_file: .env
    environment:
      # inside the compose network redis always lives here
      REDIS_URL: redis://redis:6379/0
    extra_hosts:
      # lets MONGO_URI=mongodb://host.docker.internal:27017 reach the host's mongod
      - "host.docker.internal:host-gateway"
    depends_on:
      - redis
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "no", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - redis-data:/data
    restart: unless-stopped

volumes:
  redis-data:
