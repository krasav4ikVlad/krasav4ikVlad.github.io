<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#f2f1ec">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>Панель оператора</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><rect width='24' height='24' rx='6' fill='%23141414'/><text x='12' y='16.5' text-anchor='middle' font-family='-apple-system,Arial,sans-serif' font-size='10' font-weight='800' fill='white'>RS</text></svg>">
  <script>if(localStorage.getItem('op_theme')==='dark')document.documentElement.dataset.theme='dark';</script>
  <link rel="stylesheet" href="/static/styles.css?v={{v}}">
</head>
<body>
  <header id="topbar" class="hidden">
    <div class="topbar-inner">
      <div class="topbar-row1">
        <span class="brand">
          <span class="brand-mark">RS</span>
          <span>ops<br class="hidden"><span class="brand-text-full muted-part" style="display:block; line-height:1.1">панель оператора</span></span>
        </span>
        <div class="topbar-right">
          <span id="me-label"></span>
          <button class="btn btn-ghost btn-sm" id="theme-btn" title="Переключить тему"></button>
          <button class="btn btn-ghost btn-sm" id="logout-btn">Выйти</button>
        </div>
      </div>
      <nav>
        <a href="#/search" data-nav="search">Поиск</a>
        <a href="#/tickets" data-nav="tickets">Тикеты</a>
        <a href="#/stats" data-nav="stats">Активность</a>
        <a href="#/help" data-nav="help">Справка</a>
        <a href="#/bot" data-nav="bot">Бот</a>
        <a href="#/audit" data-nav="audit" class="owner-only hidden">Аудит-лог</a>
        <a href="#/operators" data-nav="operators" class="owner-only hidden">Операторы</a>
      </nav>
    </div>
  </header>

  <main id="view"></main>

  <div id="modal-root"></div>
  <div id="toast-root"></div>

  <script src="/static/app.js?v={{v}}"></script>
</body>
</html>
